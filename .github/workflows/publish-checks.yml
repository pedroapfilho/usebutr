name: Publish Checks
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-publish-checks-push-main-
      - run: pnpm typecheck
      - run: pnpm build --filter="./packages/*"
      - name: Resolve publishable packages
        id: packages
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readdirSync, readFileSync } from "node:fs";
          const dirs = readdirSync("packages", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => `packages/${entry.name}`)
            .filter((dir) => !JSON.parse(readFileSync(`${dir}/package.json`, "utf8")).private)
            .sort();
          if (dirs.length === 0) throw new Error("No publishable packages found");
          appendFileSync(process.env.GITHUB_OUTPUT, `dirs=${dirs.join(" ")}\n`);
          JS
      - name: publint
        env:
          DIRS: ${{ steps.packages.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && pnpm exec publint --strict)
          done
      - name: are-the-types-wrong
        env:
          DIRS: ${{ steps.packages.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && pnpm exec attw --pack --profile esm-only)
          done
