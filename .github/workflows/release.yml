name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit and git tags
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm publish provenance
  actions: write # dispatch the gate workflows onto the version branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # matches engines.node ">=24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions/setup-node generates an .npmrc that reads NODE_AUTH_TOKEN; must match.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # The version PR is authored by GITHUB_TOKEN, so its pull_request runs are
      # created in `action_required` and never execute: without this the PR would
      # merge and publish to npm on the feature PR's CI alone, and changesets
      # rewrites every version and internal dependency range in the workspace.
      # workflow_dispatch is exempt from that approval gate.
      - name: Run gates on the version PR
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Derived from the directory rather than listed here: a hand-maintained
        # list silently skips any gate added later, and merging this PR
        # publishes to npm. react-doctor is excluded because it is an advisory
        # reporting job with no workflow_dispatch trigger, so dispatching it
        # would fail. A new gate must therefore declare workflow_dispatch; if it
        # does not, this step fails loudly rather than skipping it silently.
        run: |
          set -euo pipefail
          gates=$(
            grep -l 'pull_request:' .github/workflows/*.yml \
              | xargs -n1 basename \
              | grep -vx 'release.yml' \
              | grep -vx 'react-doctor.yml'
          )
          if [ -z "$gates" ]; then
            echo "::error::found no gate workflows to dispatch" >&2
            exit 1
          fi
          echo "dispatching: $gates"
          for workflow in $gates; do
            gh workflow run "$workflow" --ref changeset-release/main
          done
