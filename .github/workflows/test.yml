name: Test
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      # test:coverage, not test: the shared vitest config declares coverage
      # thresholds, and only this script produces the report they gate on.
      - run: pnpm test:coverage
